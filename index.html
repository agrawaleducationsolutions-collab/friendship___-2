<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Friendship Game 😎</title>
<style>
body{
    background: radial-gradient(circle at top,#d0f0ff,#e8f5e9,#fff);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
    font-family:Arial;
    overflow:hidden;
}
h1{
    font-size:2.5rem;
    background: linear-gradient(90deg,#2196F3,#4CAF50);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.btn-container{
    position:relative;
    display:flex;
    gap:20px;
}
button{
    padding:15px 30px;
    font-size:1.2rem;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
#yesBtn{ background:#4CAF50; color:white; }
#noBtn{ background:#607D8B; color:white; position:absolute; left:120px; }
#score{ margin-top:15px; font-size:20px; }
.float{ position:absolute; font-size:20px; animation:floatUp linear infinite; }
@keyframes floatUp{ 0%{ transform:translateY(100vh); } 100%{ transform:translateY(-10vh); } }
canvas{ position:fixed; top:0; left:0; pointer-events:none; }
</style>
</head>

<body>

<h1>Best Friend Banoge? 🤝</h1>

<div class="btn-container">
<button id="yesBtn">YES 😍</button>
<button id="noBtn">NO 😒</button>
</div>

<div id="score">Score: 0 🎯</div>
<canvas id="confetti"></canvas>

<script>
// 🔥 USER ID
let userID = "User_" + Math.floor(Math.random()*100000);

// 🌍 CITY
let userCity = "Unknown";

// 📩 GOOGLE FORM URL
let formURL = "https://docs.google.com/forms/d/e/1FAIpQLSdnBM-zueKRz-eBC_DM3iyxTu5XwHNyojQEjOm9c7tkkTd0Jg/formResponse";

// 🌍 ACCURATE CITY FETCH USING BROWSER GPS
function fetchCity(callback){
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
            position => {
                let lat = position.coords.latitude;
                let lon = position.coords.longitude;

                // ✅ Free test API key (for small scale testing)
                let apiKey = "AIzaSyD-VGcjGzZJtX2hY6M5p6zjQw4w7UcTrPE"; 

                fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lon}&key=${apiKey}`)
                .then(res => res.json())
                .then(data => {
                    let cityObj = data.results[0].address_components.find(c=>c.types.includes("locality"));
                    userCity = cityObj ? cityObj.long_name : "Unknown";
                    callback();
                })
                .catch(err=>{
                    console.log("Geocoding error:", err);
                    userCity = "Unknown";
                    callback();
                });
            },
            err=>{
                console.log("GPS permission denied or error:", err);
                userCity = "Unknown";
                callback();
            }
        );
    } else {
        console.log("Geolocation not supported");
        userCity = "Unknown";
        callback();
    }
}

// 📊 PAGE OPEN TRACK
window.onload = () => {
    fetchCity(()=>{
        fetch(formURL,{
            method:"POST",
            mode:"no-cors",
            body: new URLSearchParams({
                "entry.1395297289": userID,
                "entry.1462309876": "OPEN",
                "entry.1173362905": userCity
            })
        });
    });
};

// ELEMENTS
let yesBtn = document.getElementById("yesBtn");
let noBtn = document.getElementById("noBtn");
let scoreEl = document.getElementById("score");

let yesSize = 1;
let score = 0;
let noEmojis = ["😒","😤","😡","😭","😵","🤡","👀","😜","💀"];
let emojiSets = [["💖","✨","😊","🔥","🎉"],["😂","🤣","😜","🤪","😎"],["🌸","🌼","🌺","🌻","🌷"],["⚡","🔥","💥","🌟","✨"]];
let currentSet = 0;

// ✅ YES CLICK
yesBtn.onclick = () => {
    fetch(formURL,{
        method:"POST",
        mode:"no-cors",
        body: new URLSearchParams({
            "entry.1395297289": userID,
            "entry.1462309876": "YES",
            "entry.1173362905": userCity
        })
    });

    document.body.innerHTML = `
    <canvas id="confetti"></canvas>
    <div style="text-align:center; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh;">
        <h1 style="color:#4CAF50">Yayyyy 😍</h1>
        <p style="font-size:22px">Ab se hum best friends forever 😎🤝</p>
        <div style="font-size:100px">🎉🤝🎊</div>
    </div>
    `;
    startConfetti();
};

// ❌ NO CLICK
noBtn.onclick = () => {
    fetch(formURL,{
        method:"POST",
        mode:"no-cors",
        body: new URLSearchParams({
            "entry.1395297289": userID,
            "entry.1462309876": "NO",
            "entry.1173362905": userCity
        })
    });

    score++;
    scoreEl.innerText = "Score: " + score + " 🎯";

    yesSize += 0.1;
    yesBtn.style.transform = `scale(${yesSize})`;

    let emoji = noEmojis[Math.floor(Math.random()*noEmojis.length)];
    noBtn.innerText = "NO " + emoji;

    noBtn.style.position = "fixed";
    noBtn.style.left = Math.random()*window.innerWidth + "px";
    noBtn.style.top = Math.random()*window.innerHeight + "px";

    currentSet = (currentSet + 1) % emojiSets.length;
};

// 🌟 FLOATING EMOJIS
function createFloat(){
    let el = document.createElement("div");
    el.classList.add("float");
    let emojis = emojiSets[currentSet];
    el.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100 + "vw";
    el.style.animationDuration = (Math.random()*3+2)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),5000);
}
setInterval(createFloat,300);

// 🎉 CONFETTI
function startConfetti(){
    let canvas = document.getElementById("confetti");
    let ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let pieces = [];
    for(let i=0;i<120;i++){
        pieces.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, dy:Math.random()*5+2, size:Math.random()*5+2});
    }
    function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        pieces.forEach(p=>{
            ctx.fillRect(p.x,p.y,p.size,p.size);
            p.y += p.dy;
            if(p.y > canvas.height) p.y = 0;
        });
        requestAnimationFrame(draw);
    }
    draw();
}
</script>
</body>
</html>
